<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cloudflare OS Studio</title>
<style>
  :root {
    --paper:#F6F5F2; --surface:#FFFFFF; --ink:#211D18; --ink-soft:#5C554C; --line:#DDD8D0;
    --ember:#D14E00; --ember-soft:#FBEDE3; --slate:#44607A; --slate-soft:#E9EEF3;
    --moss:#3E7A4E; --moss-soft:#E7F0E9; --warn:#9A6B12; --warn-soft:#F7EEDB;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --display:Futura,"Century Gothic","URW Gothic","Avenir Next","Segoe UI",sans-serif;
    --body:"Avenir Next",Avenir,Seravek,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --paper:#171412; --surface:#201C18; --ink:#EAE5DE; --ink-soft:#A89F93; --line:#38322B;
    --ember:#FF8A3D; --ember-soft:#33241A; --slate:#8FB0CC; --slate-soft:#1E2831;
    --moss:#7FB58D; --moss-soft:#1D2A20; --warn:#D9A94A; --warn-soft:#2E2717; } }
  :root[data-theme="dark"] {
    --paper:#171412; --surface:#201C18; --ink:#EAE5DE; --ink-soft:#A89F93; --line:#38322B;
    --ember:#FF8A3D; --ember-soft:#33241A; --slate:#8FB0CC; --slate-soft:#1E2831;
    --moss:#7FB58D; --moss-soft:#1D2A20; --warn:#D9A94A; --warn-soft:#2E2717; }
  :root[data-theme="light"] {
    --paper:#F6F5F2; --surface:#FFFFFF; --ink:#211D18; --ink-soft:#5C554C; --line:#DDD8D0;
    --ember:#D14E00; --ember-soft:#FBEDE3; --slate:#44607A; --slate-soft:#E9EEF3;
    --moss:#3E7A4E; --moss-soft:#E7F0E9; --warn:#9A6B12; --warn-soft:#F7EEDB; }

  * { box-sizing:border-box; }
  :root { color-scheme: light dark; }
  body { background:var(--paper); color:var(--ink); font-family:var(--body); margin:0; font-size:15px; line-height:1.55; }
  .app { max-width:74rem; margin:0 auto; padding:0 1rem 5rem; }

  /* Header */
  .hdr { display:flex; flex-wrap:wrap; gap:0.8rem 1.4rem; align-items:center; padding:1.1rem 0 0.9rem; border-bottom:3px solid var(--ink); }
  .brand { font-family:var(--display); font-size:1.15rem; letter-spacing:0.04em; display:flex; align-items:center; gap:0.6rem; }
  .brand svg { width:1.7rem; height:1.7rem; color:var(--ember); flex:none; }
  .brand .dot { color:var(--ember); }
  .brand small { display:block; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.16em; color:var(--ink-soft); }
  @media (max-width: 720px) {
    .hdr { gap:0.6rem; }
    .brand { flex:1 1 100%; }
    #clientSel { flex:1 1 100%; }
    .hdr .spacer { display:none; }
    .hdr > button { flex:1 1 auto; padding:0.5rem 0.4rem; font-size:0.66rem; }
  }
  .hdr .spacer { flex:1; }
  select, input[type=text], input[type=number], input[type=date], textarea {
    font-family:var(--body); font-size:0.9rem; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); padding:0.5rem 0.65rem; border-radius:7px; max-width:100%;
  }
  textarea { width:100%; resize:vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--ember); outline-offset:1px; }
  button { font-family:var(--display); font-size:0.74rem; text-transform:uppercase; letter-spacing:0.1em;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); padding:0.5rem 0.85rem; border-radius:7px; cursor:pointer; }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: color 0.15s, border-color 0.15s, background-color 0.15s, box-shadow 0.15s; }
  }
  button:hover { border-color:var(--ember); color:var(--ember); background:var(--ember-soft); }
  button.primary { background:var(--ember); border-color:var(--ember); color:var(--paper); }
  button.primary:hover { opacity:0.9; color:var(--paper); }
  button.ghost { border:none; background:none; padding:0.3rem 0.4rem; }
  button.danger:hover { border-color:#B3391B; color:#B3391B; }

  /* Phase tabs — segmented control with live status badges */
  .tabs { display:flex; gap:0.3rem; margin:1.1rem 0 1.4rem; border:1px solid var(--line); background:var(--surface); overflow-x:auto;
    border-radius:12px; padding:0.3rem; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
  .tabs button { flex:1; border:none; border-radius:9px; padding:0.7rem 0.9rem; white-space:nowrap;
    display:flex; align-items:center; justify-content:center; gap:0.45rem; }
  .tabs button:hover { background:var(--ember-soft); }
  .tabs button .n { color:var(--ember); }
  .tabs button.active { background:var(--ember); color:var(--paper); }
  .tabs button.active .n { color:var(--paper); }
  .tab-badge { font-family:var(--mono); font-size:0.62rem; font-variant-numeric:tabular-nums; letter-spacing:0;
    background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:0.05rem 0.5rem; color:var(--ink-soft); }
  .tabs button.active .tab-badge { background:rgba(0,0,0,0.18); border-color:transparent; color:var(--paper); }
  .tab-badge:empty { display:none; }

  h2 { font-family:var(--display); font-size:1.2rem; letter-spacing:0.02em; margin:1.6rem 0 0.3rem; }
  h2 + .hint { margin-top:0; }
  .hint { color:var(--ink-soft); font-size:0.88rem; margin:0.1rem 0 0.9rem; max-width:56rem; }
  .card { background:var(--surface); border:1px solid var(--line); padding:1.15rem 1.25rem; margin:0 0 1.2rem;
    border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,0.05), 0 8px 24px -18px rgba(0,0,0,0.25); }
  .card h3 { font-family:var(--display); font-size:0.95rem; margin:0 0 0.7rem; letter-spacing:0.03em; }
  .card h3 .tag { font-family:var(--mono); font-size:0.66rem; color:var(--ink-soft); font-weight:400; margin-left:0.5rem; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:0.7rem 1.1rem; }
  .field label { display:block; font-family:var(--display); font-size:0.64rem; text-transform:uppercase; letter-spacing:0.13em; color:var(--slate); margin-bottom:0.2rem; }
  .field input, .field select { width:100%; }
  .checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(14rem,1fr)); gap:0.25rem 1rem; }
  .checks label { display:flex; gap:0.5rem; align-items:baseline; font-size:0.9rem; cursor:pointer; }
  .checks input { accent-color:var(--ember); }
  .pill { display:inline-block; font-family:var(--mono); font-size:0.62rem; padding:0.05rem 0.45rem; border:1px solid var(--line); border-radius:99px; color:var(--ink-soft); }
  .pill.stock { border-color:var(--moss); color:var(--moss); }
  .pill.custom { border-color:var(--ember); color:var(--ember); }
  .pill.tierA { border-color:var(--moss); color:var(--moss); }
  .pill.tierB { border-color:var(--warn); color:var(--warn); }
  .pill.tierC { border-color:#B3391B; color:#B3391B; }

  .tbl { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:0.88rem; }
  th { font-family:var(--display); text-align:left; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft); padding:0.45rem 0.6rem; border-bottom:2px solid var(--ink); white-space:nowrap; }
  td { padding:0.45rem 0.6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  .num { font-variant-numeric:tabular-nums; text-align:right; }
  td input[type=number] { width:4.2rem; }
  td input[type=text] { min-width:8rem; }

  .empty { color:var(--ink-soft); font-size:0.88rem; font-style:italic; padding:0.9rem; border:1px dashed var(--line); border-radius:9px; text-align:center; }
  .row-actions button { font-size:0.62rem; padding:0.25rem 0.5rem; }

  /* Use-case register: stacked cards on phones */
  @media (max-width: 760px) {
    #ucTable, #ucTable tbody { display:block; min-width:0; }
    #ucTable thead { display:none; }
    #ucTable tr { display:grid; grid-template-columns:repeat(3, 1fr); gap:0.55rem 0.7rem;
      border:1px solid var(--line); border-radius:10px; padding:0.8rem; margin-bottom:0.8rem; background:var(--surface); }
    #ucTable td { display:block; border:none; padding:0; white-space:normal; }
    #ucTable td[data-label]::before { content:attr(data-label); display:block; font-family:var(--display);
      font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--slate); margin-bottom:0.2rem; }
    #ucTable td.c-name { grid-column:1 / -1; }
    #ucTable td.c-dept { grid-column:1 / -1; }
    #ucTable td input[type=text], #ucTable td input[type=number], #ucTable td select { width:100%; }
    #ucTable td.c-pilot { text-align:left; }
    #ucTable td.c-hrs { align-self:end; }
  }

  /* Phase navigation footer */
  .phase-nav { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin:1.8rem 0 0.5rem; }
  .phase-nav button { padding:0.65rem 1.1rem; }

  /* Build guide */
  .step { display:grid; grid-template-columns:2.4rem 1fr; gap:0.9rem; padding:1.1rem 0; border-bottom:1px solid var(--line); }
  .step-num { width:2rem; height:2rem; border:2px solid var(--ember); color:var(--ember); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:0.95rem; }
  .step.done .step-num { background:var(--moss); border-color:var(--moss); color:var(--paper); }
  .step h3 { font-family:var(--display); font-size:1rem; margin:0.1rem 0 0.45rem; display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; }
  .step h3 label { font-family:var(--body); font-size:0.75rem; color:var(--ink-soft); display:flex; gap:0.35rem; align-items:center; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400; }
  .step h3 input { accent-color:var(--moss); }
  .step-body { max-width:52rem; font-size:0.92rem; }
  .step-body ol, .step-body ul { padding-left:1.2rem; margin:0.4rem 0 0.7rem; }
  .step-body li { margin-bottom:0.25rem; }
  .step-body li::marker { color:var(--ember); }
  .codeblock { position:relative; margin:0.6rem 0 0.8rem; }
  .codeblock pre { background:#211D18; color:#EFE9E0; font-family:var(--mono); font-size:0.78rem; line-height:1.5; padding:0.85rem 1rem; overflow-x:auto; margin:0; border-radius:9px; }
  :root[data-theme="dark"] .codeblock pre { background:#0F0D0B; border:1px solid var(--line); }
  .codeblock .copy { position:absolute; top:0.45rem; right:0.45rem; font-size:0.6rem; padding:0.25rem 0.55rem; background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.3); }
  .codeblock .copy:hover { border-color:#fff; color:#fff; }
  .verify { background:var(--moss-soft); border-left:3px solid var(--moss); padding:0.5rem 0.8rem; font-size:0.85rem; margin-top:0.5rem; }
  .verify b { color:var(--moss); font-family:var(--display); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.12em; display:block; }
  .note { background:var(--slate-soft); border-left:3px solid var(--slate); padding:0.5rem 0.8rem; font-size:0.85rem; margin:0.5rem 0; }
  .note b { color:var(--slate); }
  .warnbox { background:var(--warn-soft); border-left:3px solid var(--warn); padding:0.5rem 0.8rem; font-size:0.85rem; margin:0.5rem 0; }
  .inline-input { display:inline-block; }
  .inline-input input { font-family:var(--mono); font-size:0.8rem; }

  .progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:0.6rem 0 0.2rem; }
  .progress i { display:block; height:100%; background:var(--moss); transition:width 0.25s; }
  @media (prefers-reduced-motion: reduce) { .progress i { transition:none; } }

  .intro { border-left:4px solid var(--ember); }
  .intro ol { margin:0.3rem 0 0.7rem; }
  .intro .dismiss { float:right; }
  button[disabled] { opacity:0.5; cursor:default; }
  .ai-opt { font-family:var(--display); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.13em; color:var(--ember); margin:0.9rem 0 0.35rem; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:60; padding:1rem; }
  .modal { background:var(--surface); border:1px solid var(--line); padding:1.1rem 1.2rem; max-width:38rem; width:100%; border-radius:12px; }
  .modal h3 { font-family:var(--display); font-size:0.9rem; margin:0 0 0.5rem; }
  .modal textarea { font-family:var(--mono); font-size:0.75rem; }
  .toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--display); font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.55rem 1.1rem; border-radius:4px; opacity:0; pointer-events:none; transition:opacity 0.2s; z-index:50; }
  .toast.show { opacity:1; }
  .qa { margin-bottom:0.8rem; }
  .qa .q { font-size:0.85rem; font-weight:600; margin-bottom:0.2rem; }
  details { border:1px solid var(--line); background:var(--surface); margin-bottom:0.7rem; border-radius:10px; overflow:hidden; }
  details summary { cursor:pointer; padding:0.6rem 0.9rem; font-family:var(--display); font-size:0.85rem; letter-spacing:0.03em; }
  details[open] summary { border-bottom:1px solid var(--line); }
  details .inner { padding:0.8rem 0.9rem; }

  /* Blueprint document: hidden on screen, becomes the page when printing */
  #blueprint { display:none; }
  .bp-actions { display:flex; gap:0.6rem; flex-wrap:wrap; margin:0.8rem 0 0.4rem; }
  @media print {
    .app, .toast, .modal-overlay { display:none !important; }
    #blueprint { display:block !important; }
    body { background:#fff !important; }
  }
</style>

<div class="app">
  <header class="hdr">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2 L20.66 7 L20.66 17 L12 22 L3.34 17 L3.34 7 Z"></path>
        <circle cx="12" cy="12" r="3.2"></circle>
      </svg>
      <div>Cloudflare OS <span class="dot">Studio</span><small>Discovery → Design → Build · vendor cockpit</small></div>
    </div>
    <div class="spacer"></div>
    <select id="clientSel" aria-label="Active client"></select>
    <button id="btnNew" title="Start a new client engagement">+ New client</button>
    <button id="btnExport" title="Download this client's data as JSON (backup / move machines)">Export</button>
    <button id="btnImport" title="Load a previously exported client JSON">Import</button>
    <button id="btnDelete" class="danger" title="Delete the selected client permanently">Delete</button>
  </header>

  <nav class="tabs" aria-label="Phases">
    <button data-tab="discovery" class="active"><span class="n">1</span>Discovery<span class="tab-badge" id="tb-discovery" title="use cases captured"></span></button>
    <button data-tab="design"><span class="n">2</span>Design &amp; Scope<span class="tab-badge" id="tb-design" title="pilot workflows"></span></button>
    <button data-tab="build"><span class="n">3</span>Build Guide<span class="tab-badge" id="tb-build" title="setup progress"></span></button>
  </nav>

  <main id="view"></main>
</div>
<div id="blueprint" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* =============================== catalogs =============================== */
const IQ = [
  "Walk me through yesterday morning, task by task.",
  "What do you redo every week or month that feels identical each time?",
  "What takes a new hire longest to learn?",
  "Which emails or messages do you dread, and why?",
  "What information lives only in one person's head?",
  "What reports do you produce — for whom, from which systems, how often?",
  "Where do you wait on approvals, and how long?",
  "Between which systems do you re-key the same data?",
  "If you got five hours back a week, what would you spend them on?",
  "What should NEVER be automated here?"
];

const SYS = [
  { id:"google",     label:"Google Workspace (mail · calendar · Drive)", kind:"stock",  wave:1, effort:"0.5–1 day" },
  { id:"m365",       label:"Microsoft 365 (Graph)",                      kind:"custom", cls:"Graph", wave:1, effort:"5–10 days" },
  { id:"slack",      label:"Slack",                                      kind:"stock",  wave:1, effort:"0.5 day" },
  { id:"notion",     label:"Notion",                                     kind:"stock",  wave:1, effort:"0.5 day" },
  { id:"confluence", label:"Confluence",                                 kind:"stock",  wave:1, effort:"0.5 day" },
  { id:"zoominfo",   label:"ZoomInfo",                                   kind:"stock",  wave:1, effort:"0.5 day" },
  { id:"qbo",        label:"QuickBooks Online",                          kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"3–7 days" },
  { id:"stripe",     label:"Stripe",                                     kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"3–7 days" },
  { id:"square",     label:"Square",                                     kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"3–7 days" },
  { id:"hubspot",    label:"HubSpot",                                    kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"3–7 days" },
  { id:"ghl",        label:"GoHighLevel (CRM · funnels · booking · payments)", kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"1–2 weeks" },
  { id:"cfapi",      label:"Cloudflare API (client provisioning)", vert:"agency", kind:"stock", wave:1, effort:"0.5–1 day" },
  { id:"salesforce", label:"Salesforce",                                 kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"5–10 days" },
  { id:"netsuite",   label:"NetSuite (ERP)",             vert:"manufacturing", kind:"custom", cls:"Vertical SaaS", wave:3, effort:"2–4 weeks" },
  { id:"epicor",     label:"Epicor / on-prem ERP",       vert:"manufacturing", kind:"custom", cls:"On-prem via Mesh/Tunnel", wave:3, effort:"3–6 weeks" },
  { id:"cmms",       label:"CMMS / maintenance system",  vert:"manufacturing", kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" },
  { id:"clio",       label:"Clio (practice mgmt)",       vert:"law",           kind:"custom", cls:"OAuth SaaS REST", wave:3, effort:"1–3 weeks" },
  { id:"imanage",    label:"iManage / NetDocuments (DMS)", vert:"law",         kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" },
  { id:"wealthbox",  label:"Wealthbox / Redtail (CRM)",  vert:"finserv",       kind:"custom", cls:"OAuth SaaS REST", wave:2, effort:"3–7 days" },
  { id:"orion",      label:"Orion / Black Diamond (portfolio)", vert:"finserv", kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" },
  { id:"emoney",     label:"eMoney / RightCapital (planning)",  vert:"finserv", kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" },
  { id:"webpt",      label:"WebPT / Prompt / Jane (EMR)", vert:"pt",           kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" },
  { id:"clearing",   label:"Eligibility / clearinghouse portal", vert:"pt",    kind:"custom", cls:"Vertical SaaS", wave:3, effort:"1–3 weeks" }
];

const VERTICALS = {
  manufacturing: { label:"Manufacturing", guard:"OT/MES strictly read-only; PO issuance and quote sends behind approval; pricing data scoped to estimating roles.",
    starters:[
      { name:"RFQ triage → draft quote from cost history", dept:"Sales/Estimating", freq:10, minutes:45, people:2, feas:4, risk:"B", systems:["netsuite","google"] },
      { name:"Daily production & downtime digest", dept:"Ops", freq:5, minutes:30, people:3, feas:4, risk:"A", systems:["epicor"] },
      { name:"Supplier email triage → PO status answers", dept:"Purchasing", freq:25, minutes:10, people:2, feas:4, risk:"B", systems:["google","netsuite"] },
      { name:"Maintenance ticket summarization + CAPA drafts", dept:"Quality", freq:8, minutes:25, people:2, feas:3, risk:"A", systems:["cmms"] } ] },
  law: { label:"Law firm", guard:"Ethical walls via per-matter gatekeeper scoping; nothing filed or sent without attorney approval; no-training model endpoints only.",
    starters:[
      { name:"Intake triage + conflicts pre-check", dept:"Intake", freq:15, minutes:20, people:2, feas:4, risk:"B", systems:["clio","google"] },
      { name:"Matter chronology builder", dept:"Attorneys", freq:6, minutes:60, people:4, feas:3, risk:"A", systems:["imanage"] },
      { name:"Prebill narrative scrub", dept:"Billing", freq:4, minutes:90, people:1, feas:4, risk:"B", systems:["clio"] },
      { name:"Deadline / docket digest", dept:"All", freq:5, minutes:15, people:6, feas:5, risk:"A", systems:["google","clio"] } ] },
  finserv: { label:"Financial services (RIA)", guard:"No client-facing advice without advisor sign-off; PII reads block external sends; trading & money movement stay outside the OS.",
    starters:[
      { name:"Meeting-prep brief (CRM + holdings + notes)", dept:"Advisors", freq:12, minutes:40, people:3, feas:4, risk:"A", systems:["wealthbox","orion","google"] },
      { name:"Post-meeting summary → CRM notes/tasks", dept:"Advisors", freq:12, minutes:25, people:3, feas:4, risk:"B", systems:["wealthbox"] },
      { name:"Client review decks on live data", dept:"Advisors", freq:6, minutes:75, people:2, feas:3, risk:"A", systems:["orion"] },
      { name:"Marketing-rule pre-review of outbound content", dept:"Compliance", freq:5, minutes:30, people:1, feas:4, risk:"B", systems:["google"] } ] },
  salesmkt: { label:"Sales & marketing org", guard:"Outbound email behind approval until tone/deliverability proven; discount data scoped by role; brand-voice skill on all client-facing drafts.",
    starters:[
      { name:"Account research brief + call prep", dept:"Sales", freq:20, minutes:30, people:4, feas:5, risk:"A", systems:["hubspot","zoominfo","google"] },
      { name:"Proposal generation from CRM context", dept:"Sales", freq:8, minutes:60, people:3, feas:4, risk:"B", systems:["hubspot","google"] },

function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}
  if (!d || !d.clients) d = { clients:{}, active:null, tab:"discovery" };
  if (!d.hqSeeded) {
    d.hqSeeded = true;
    if (!d.clients.hq) { d.clients.hq = hqClient(); d.active = "hq"; }
  }
  if (!d.active || !d.clients[d.active]) d.active = Object.keys(d.clients)[0];
  if (!d.active) { d.clients.hq = hqClient(); d.active = "hq"; }
  return d;
}

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function slug(s){ return (s||"client").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "client"; }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200); }
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(()=>toast("Copied"), ()=>legacyCopy(txt));
  else legacyCopy(txt);
}
function legacyCopy(txt){
  const ta = document.createElement("textarea"); ta.value = txt;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove();
  if (ok) toast("Copied"); else showCopyModal(txt);
}
function showCopyModal(txt){
  const ov = document.createElement("div"); ov.className = "modal-overlay";
  ov.innerHTML = `<div class="modal"><h3>Clipboard is blocked here — copy manually</h3>
    <textarea rows="10" readonly style="width:100%"></textarea>
    <p class="hint" style="margin:0.5rem 0">The text is selected — press Cmd+C (Mac) or Ctrl+C, then Close.</p>
    <button class="primary" data-close>Close</button></div>`;
  ov.querySelector("textarea").value = txt;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector("[data-close]").onclick = close;
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  const t = ov.querySelector("textarea"); t.focus(); t.select();
}
function clampNum(v, min, max, dflt){ const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n))) : dflt; }
function fmtNum(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function effectiveRate(rate){ const n = Number(rate); return Number.isFinite(n) && n > 0 ? Math.round(n) : 50; }

document.getElementById("btnExport").onclick = async () => {
  const data = JSON.stringify({ client:C() }, null, 2);
  const filename = `cfos-${slug(C().name)}.json`;
  if (window.claude && window.claude.downloads && window.claude.downloads.save) {
    try { await window.claude.downloads.save({ filename, data }); toast("Exported"); return; }
    catch(err){
      if (err && err.code === "declined") { toast("Export cancelled"); return; }
      if (err && err.code === "rate_limited") { toast("A save prompt is already open"); return; }
      /* other codes: fall through to plain download */
    }
  }
  const blob = new Blob([data], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = filename; a.click(); URL.revokeObjectURL(a.href); toast("Exported");
};
document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {

      if (!c.name) throw new Error("no name");

      db.clients[id] = Object.assign(blankClient(c.name), c); db.active = id; save(); render(); toast("Imported");

  e.target.value = "";
};

function bind(elId, path, attr){
  const el = document.getElementById(elId); if (!el) return;
  el.addEventListener(attr || "input", () => {
    const parts = path.split("."); let o = C();
    for (let i=0;i<parts.length-1;i++) o = o[parts[i]];
    o[parts[parts.length-1]] = (el.type === "number") ? Number(el.value) : el.value;
    save();
  });
}

function aiPrompt(){
  const c = C();
  const allowed = SYS.filter(s => !s.vert || s.vert === c.vertical).map(s => `${s.id} = ${s.label}`).join("\n");
  const ivs = c.interviews.map(iv =>
    `### ${iv.person||"?"} — ${iv.role||"?"}\n` +
    IQ.map((q,i) => iv.answers[i] ? `Q: ${q}\nA: ${iv.answers[i]}` : "").filter(Boolean).join("\n")
  ).join("\n\n") || "(no interviews captured)";
  const inbox = c.inbox.map(it => `- [${it.dept||"?"} · ~${it.freq}/wk] ${it.text}`).join("\n") || "(no inbox items)";
  const existing = c.useCases.map(u => u.name).join("; ") || "(none)";
  return `You are an AI-workspace deployment consultant. Below is raw discovery data from ${c.name}, a ${VERTICALS[c.vertical].label.toLowerCase()} with ~${c.size||"?"} employees. Synthesize it into candidate automation use cases for an agent workspace (Cloudflare OS) where agents read/write business systems through governed gatekeepers.

## Systems in scope (use ONLY these ids in "systems")
${allowed}

## Interviews
${ivs}

## Routine-work inbox log
${inbox}

## Survey / other notes
${c.surveyNotes || "(none)"}

## Already-registered use cases (do NOT repeat these)
${existing}

## Your task
Propose 5–12 NEW use cases. For each, estimate honestly from the data above:
- freq: times per week it occurs
- minutes: minutes per occurrence today
- people: how many people do this work
- feas: 1–5 API/data feasibility (5 = clean API + verifiable output)
- risk: "A" read-only, "B" writes behind human approval, "C" external side effects (emails to customers, payments, filings)

Respond with ONLY a JSON array, no prose, no markdown fences:
[{"name":"...","dept":"...","freq":N,"minutes":N,"people":N,"feas":N,"risk":"A|B|C","systems":["id",...]}]`;
}

function ingestAI(raw){
  const c = C();
  let t = raw.trim().replace(/^```[a-z]*\s*/i, "").replace(/```\s*$/, "");
  const start = t.indexOf("["), end = t.lastIndexOf("]");
  if (start < 0 || end <= start) { toast("No JSON array found in the paste"); return; }
  let arr;
  try { arr = JSON.parse(t.slice(start, end + 1)); }
  catch(e){ toast("Couldn't parse that as JSON — paste the model's array exactly"); return; }
  if (!Array.isArray(arr)) { toast("Expected a JSON array"); return; }
  const okIds = new Set(SYS.map(s => s.id));
  let added = 0, skipped = 0;
  arr.slice(0, 15).forEach(r => {
    if (!r || typeof r.name !== "string" || !r.name.trim()) { skipped++; return; }
    if (c.useCases.some(u => u.name.trim().toLowerCase() === r.name.trim().toLowerCase())) { skipped++; return; }
    c.useCases.push({
      name: r.name.trim().slice(0, 120),
      dept: String(r.dept || "").slice(0, 40),
      freq: clampNum(r.freq, 0, 500, 1),
      minutes: clampNum(r.minutes, 0, 600, 15),
      people: clampNum(r.people, 1, 500, 1),
      feas: clampNum(r.feas, 1, 5, 3),
      risk: ["A","B","C"].includes(r.risk) ? r.risk : "B",
      systems: Array.isArray(r.systems) ? r.systems.filter(id => okIds.has(id)) : [],
      pilot: false
    });
    added++;
  });
  save(); render();
  toast(added ? `${added} added${skipped ? `, ${skipped} skipped` : ""} — review the numbers` : "Nothing new to add");
}

async function aiViaEndpoint(){
  const url = (db.aiEndpoint || "").trim();
  if (!url) { toast("Set the endpoint URL first"); return; }
  if (!/^https:\/\//.test(url)) { toast("Endpoint must be https://"); return; }
  const btn = document.getElementById("btnAiRun");
  btn.disabled = true; btn.textContent = "Generating…";
  const payload = { prompt: aiPrompt() };
  const prov = db.aiProvider || "server";
  if (prov !== "server") {
    payload.provider = prov;
    if (db.aiKey) payload.apiKey = db.aiKey;
    if (db.aiModel) payload.model = db.aiModel;
    if (prov === "openai-compatible" && db.aiBaseUrl) payload.baseUrl = db.aiBaseUrl;
  }
  try {
    const res = await fetch(url, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let text;
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("json")) { const j = await res.json(); text = j.text || j.completion || j.content || JSON.stringify(j); }
    else text = await res.text();
    ingestAI(text);
  } catch(e){
    const note = document.getElementById("aiEndpointNote");
    if (note) note.style.display = "block";
    toast("Endpoint call failed — see the note");
  } finally {
    btn.disabled = false; btn.textContent = "Generate via endpoint";
  }
}

const WORKER_SNIPPET = `// ai-proxy worker — deploy in the SAME Cloudflare account, key stays server-side
// wrangler secret put ANTHROPIC_API_KEY
const CORS = {
  "access-control-allow-origin": "https://studio.yourfirm.com", // your studio hostname
  "access-control-allow-methods": "POST, OPTIONS",
  "access-control-allow-headers": "content-type"
};
export default {
  async fetch(req, env) {
    if (req.method === "OPTIONS") return new Response(null, { headers: CORS });
    if (req.method !== "POST") return new Response("POST only", { status: 405, headers: CORS });
    const { prompt } = await req.json();
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": env.ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 3000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const j = await r.json();
    const text = (j.content && j.content[0] && j.content[0].text) || "";
    return new Response(JSON.stringify({ text }), {
      headers: { "content-type": "application/json", ...CORS }
    });
  }
};`;

/* =============================== design =============================== */
function designModel(){
  const c = C();
  const chosen = SYS.filter(s => c.systems.includes(s.id));
  const stock = chosen.filter(s=>s.kind==="stock");
  const custom = chosen.filter(s=>s.kind==="custom");
  const routes = c.mcpRoutes || {};
  const mcpRouted = custom.filter(s=>routes[s.id]);
  const customBuild = custom.filter(s=>!routes[s.id]);
  const ranked = [...c.useCases].map(u => ({ ...u, hrsMo: u.freq*u.minutes*u.people*4.33/60, score: u.freq*u.minutes*u.people*u.feas }))
    .sort((a,b)=>b.score-a.score);
  let pilots = ranked.filter(u=>u.pilot);
  const suggested = ranked.filter(u=>u.risk!=="C").slice(0,5);
  if (!pilots.length) pilots = suggested;
  const totalHrs = Math.round(pilots.reduce((a,u)=>a+u.hrsMo,0));
  const rate = effectiveRate(c.hourlyRate);
  const totalVal = totalHrs * rate;
  const workflows = pilots.filter(u => u.cadence && u.cadence !== "demand");
  const small = Number(c.size||0) > 0 && Number(c.size) <= 30;
  const intWeeks = Math.max(2, Math.ceil(customBuild.length*1.5));
  const weeks = (small?2:3) + 1 + intWeeks + 3 + (Number(c.size)>100?4:3) + 2;
  return { c, chosen, stock, custom, mcpRouted, customBuild, workflows, ranked, pilots, suggested, totalHrs, totalVal, rate, weeks, small, intWeeks };
}

    ${m.workflows.map(u=>`<tr><td style="white-space:normal">${esc(u.name)}</td><td><span class="pill ${u.cadence==="event"?"custom":"stock"}">${u.cadence==="event"?"external event / webhook":u.cadence}</span></td><td>${esc(u.dept)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint" style="margin:0.6rem 0 0">Built as platform Workflows: code for the predictable steps, models only where judgment adds value — reliable loops instead of prompt-and-pray.</p>

  ${(c.knowledge||[]).length ? `<div class="card"><h3>Knowledge &amp; retrieval plan <span class="tag">what agents know, and how it stays fresh</span></h3>
    <div class="tbl"><table><thead><tr><th>Source</th><th>Retrieval route</th><th>Owner</th></tr></thead><tbody>
    ${(c.knowledge||[]).map(k=>{
      const route = k.type==="wiki" ? "Live via its gatekeeper" : k.type==="templates" ? "Document/slide templates" : k.type==="data" ? "Live gatekeeper reads (never copied)" : "R2 + AI Search — embeddings-based hybrid retrieval";

    }).join("")}
    </tbody></table></div>
  </div>` : ""}

  <div class="card"><h3>Policy matrix <span class="tag">what needs a human, and which human</span></h3>

    <div class="note" style="margin-top:0.6rem"><b>Vertical guardrails — ${VERTICALS[c.vertical].label}:</b> ${VERTICALS[c.vertical].guard}</div>

  <div class="card"><h3>Model matrix &amp; budgets</h3>

      <tr><td>Drafting, briefs, gadget building</td><td>${c.provider==="openai"?"OpenAI mid tier":"Sonnet-class mid tier"}</td><td>Default for Workspaces</td></tr>
      <tr><td>High-value judgment work</td><td>Frontier tier, explicitly selected</td><td>Per-team budget cap in AI Gateway</td></tr>
      <tr><td>All users</td><td>—</td><td>${c.dailyLimit} calls/user/day allowance; alerts at 80% of team budget</td></tr>
    </tbody></table></div>
  </div>

  <div class="card"><h3>Timeline <span class="tag">~${m.weeks} weeks total</span></h3>

      <tr><td>Pilot</td><td class="num">3</td></tr>
      <tr><td>Rollout &amp; training</td><td class="num">${Number(c.size)>100?4:3}</td></tr>

  </div>

  <div class="card"><h3>Scope document <span class="tag">markdown, ready for your proposal</span></h3>

/* =============================== build guide =============================== */
function buildSteps(){
  const c = C();
  const host = hostnameFor(c), stag = stagingFor(c), sl = slug(c.name);
  const admins = c.adminEmails || "you@yourfirm.com";
  const steps = [];

  steps.push({ id:"prereq", title:"Prepare your machine",
    body:`<p>Everything installs on your Mac (or the client's designated deploy machine). This machine is only the <strong>deploy workstation</strong> — Cloudflare OS itself runs entirely on Cloudflare's network, so nothing here needs to stay online after a deploy. One block, run in Terminal:</p>`,
    code:`# Node 24 via nvm, pnpm 11, and Cloudflare's CLI
curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
# close & reopen the terminal, then:
nvm install 24
npm install -g pnpm@11 wrangler
wrangler login   # opens a browser — log in to the CLIENT's Cloudflare account`,
    verify:`Run <code>node -v</code> (shows v24.x), <code>pnpm -v</code> (shows 11.x), and <code>wrangler whoami</code> (shows the client's account, not yours).` });

  steps.push({ id:"account", title:"Cloudflare account & Workers Paid plan",
    body:`<ol>
      <li>Have ${esc(c.itOwner||"the IT owner")} create the account at <code>dash.cloudflare.com/sign-up</code> using a company email (never a personal one). If an account exists, get yourself invited as an admin (scoped; you'll revoke this at handoff).</li>
      <li>In the dashboard: <strong>Workers &amp; Pages → Plans → upgrade to Workers Paid</strong> ($5/mo base).</li>
      <li>Copy the <strong>Account ID</strong> (right-hand sidebar of any zone page, or Workers &amp; Pages overview) and paste it here — it flows into the config below:</li>
    </ol>
    <span class="inline-input"><input type="text" data-bind="accountId" value="${esc(c.accountId)}" placeholder="32-char account ID" size="36"></span>`,
    verify:`Account ID field above is filled; Workers &amp; Pages shows "Paid plan".` });

  steps.push({ id:"zone", title:`Get ${esc(host)} ready`,
    body: c.domainOnCf==="yes"
      ? `<p><strong>${esc(c.domain||"the company domain")}</strong> is already on Cloudflare — nothing to migrate. The deploy will attach the Workers to <code>${esc(host)}</code> and <code>${esc(stag)}</code>; you only need the zone active in this account.</p>`
      : `<ol>
          <li>In the dashboard: <strong>Add a domain</strong> → enter <code>${esc(c.domain||"the company domain")}</code> → free plan is fine for DNS.</li>
          <li>Cloudflare shows two nameservers. The client's IT owner updates nameservers at their registrar (GoDaddy/Namecheap/etc. → Domain settings → Nameservers → Custom).</li>
          <li>Wait for the zone to show <strong>Active</strong> (minutes to a few hours).</li>
          <li><em>Alternative if IT won't move the apex domain:</em> delegate just a subdomain (<code>os.${esc(c.domain||"acme.com")}</code>) as its own zone via NS records — coordinate with IT.</li>
        </ol>`,
    verify:`The zone shows <strong>Active</strong> in the dashboard.` });

  if (c.idp === "access") {
    steps.push({ id:"access", title:"Cloudflare Access application (SSO)",
      body:`<ol>
        <li>Dashboard → <strong>Zero Trust</strong> (one.dash.cloudflare.com) → pick a team name if prompted (e.g. <code>${esc(sl)}</code>).</li>
        <li><strong>Settings → Authentication → Login methods → Add</strong> — connect the client's IdP (Entra ID / Google Workspace / Okta). The client's IdP admin approves the app on their side.</li>
        <li><strong>Access → Applications → Add an application → Self-hosted</strong>. Application domain: <code>${esc(host)}</code>. Add a policy: Allow → Emails ending in <code>@${esc(c.domain||"acme.com")}</code> (tighten later).</li>
        <li>Open the application's settings and copy the <strong>Application Audience (AUD) tag</strong>. Paste it here:</li>
      </ol>
      <span class="inline-input"><input type="text" data-bind="audience" value="${esc(c.audience)}" placeholder="AUD tag (long hex string)" size="44"></span>
      <p style="margin-top:0.5rem">Repeat the application setup for <code>${esc(stag)}</code> (same IdP, a second self-hosted app).</p>`,
      verify:`Visiting <code>https://${esc(host)}</code> (even before deploy) bounces you to the IdP login instead of a DNS error page.` });
  } else if (c.idp === "google") {
    steps.push({ id:"gauth", title:"Google OAuth sign-in (auth gatekeeper)",
      body:`<ol>
        <li>Go to <code>console.cloud.google.com</code> → create a project named <code>${esc(sl)}-os</code>.</li>
        <li><strong>APIs &amp; Services → OAuth consent screen</strong>: Internal (requires Google Workspace), app name "${esc(c.name)} Workspace", support email = IT owner.</li>
        <li><strong>Credentials → Create credentials → OAuth client ID → Web application</strong>. Authorized redirect URI — exactly:</li>
      </ol>`,
      code:`https://${host}/gatekeeper/google/oauth`,
      body2:`<p>Save the client ID and secret — they go into the deployment's gatekeeper credentials in the config step. In the deployment env you will set <code>AUTH_GATEKEEPERS=google</code> and, once sign-in works, <code>DISABLE_PASSWORD_AUTH=true</code>. Sign-in requests only minimal scopes (<code>openid email profile</code>) and identity is keyed to the verified email.</p>`,
      verify:`OAuth client created; redirect URI matches the block above character-for-character.` });
  } else {
    steps.push({ id:"pwwarn", title:"Password sign-in (interim only)",
      body:`<div class="warnbox">You selected password auth. Acceptable for a first look, wrong for production — no MFA, no central offboarding. Plan to switch to Access or Google OAuth before pilot. Nothing to configure now; the deploy ships with password auth on by default.</div>`,
      verify:`You've told the sponsor this is temporary, in writing.` });
  }

  steps.push({ id:"clone", title:"Clone the starter and install",
    body:`<p>The starter wraps a <strong>pinned Cloudflare OS release</strong> with the client's config — you never patch upstream code.</p>`,
    code:`git clone https://github.com/cloudflare/cloudflare-os-starter.git ${sl}-os
cd ${sl}-os
pnpm install`,
    verify:`<code>pnpm install</code> completes without errors and the repo contains <code>deployment.jsonc</code>.` });

  steps.push({ id:"config", title:"Fill deployment.jsonc",
    body:`<p>Open <code>deployment.jsonc</code> in the cloned repo. It ships as a commented template — set these values (match by meaning; exact key names come from the template in your pinned release):</p>`,
    code:`{
  // ---- ${c.name} · generated by Cloudflare OS Studio ----
  "accountId": "${c.accountId || "<PASTE ACCOUNT ID — step 2>"}",
  "hostname": "${host}",
  // staging deployment (second copy of this file or env-specific block):
  //   "hostname": "${stag}",
  "workerName": "${sl}-os",
  ${c.idp==="access" ? `"accessAudience": "${c.audience || "<PASTE AUD TAG — Access step>"}",` : `// no Access audience — sign-in via ${c.idp==="google"?"AUTH_GATEKEEPERS=google":"password auth"}`}
  "adminEmails": [${admins.split(",").map(e=>`"${e.trim()}"`).join(", ")}]
  // KV namespaces + R2 bucket auto-provision on first deploy;
  // pin them here afterwards if the template asks for explicit IDs.
}`,
    verify:`<code>pnpm check</code> passes (it validates this file before any deploy).` });

  steps.push({ id:"deploy", title:"Deploy production and staging",
    body:`<p>Two deployments from day one — staging is where every future upgrade gets tested first.</p>`,
    code:`pnpm check     # validate config
pnpm deploy    # builds and pushes to the client's account

# then repeat with the staging hostname configured:
#   ${stag}`,
    verify:`Open <code>https://${esc(host)}</code> → you hit ${c.idp==="access"?"the IdP login, then":""} the workspace. Create a test doc; it saves. The <code>/admin</code> panel loads for an admin email.` });

  steps.push({ id:"gateway", title:"AI Gateway — models, budgets, allowance",
    body:`<ol>
      <li>Dashboard → <strong>AI → AI Gateway → Create gateway</strong> named <code>${esc(sl)}-gw</code>.</li>
      <li>Create an API token: <strong>My Profile → API Tokens → Create</strong> with <strong>AI Gateway Run + Read</strong> permissions on this account.</li>
      <li>${c.provider==="workersai" ? "Using Workers AI only — no external provider keys needed." : `Add the client's ${c.provider==="mix"?"provider keys (Anthropic + OpenAI)":c.provider==="openai"?"OpenAI key":"Anthropic key"} — keys created in the <em>client's</em> provider account, on enterprise/no-training terms, stored in the gateway or as Worker secrets. Never your own keys.`}</li>
      <li>Set the platform env (via the starter's secrets flow / <code>wrangler secret put</code> for the sensitive ones):</li>
    </ol>`,
    code:`ENABLE_CLOUDFLARE_LIMITS=true
CF_AI_GATEWAY=${sl}-gw
CF_AI_GATEWAY_ACCOUNT_ID=${c.accountId || "<ACCOUNT ID>"}
CF_AI_GATEWAY_API_TOKEN=<secret — use wrangler secret put>
DAILY_LLM_CALL_LIMIT=${c.dailyLimit || 100}`,
    verify:`Ask the workspace agent anything; the request appears in the AI Gateway logs with attribution. Set a team budget alert at 80%.` });

  steps.push({ id:"brand", title:"Branding & announcements",
    body:`<ol>
      <li>Open <code>https://${esc(host)}/admin</code> as an admin email.</li>
      <li>Set site name ("${esc(c.name)} Workspace"), logo, accent color, and a welcome announcement pointing at the pilot workflows.</li>
      <li>No redeploy needed — this is runtime config.</li>
    </ol>`,
    verify:`A non-admin pilot user sees the client's name and logo on sign-in.` });

  steps.push({ id:"email", title:"Email Routing & deliverability",
    body:`<p>Agents receive mail (the magic inbox, pipeline addresses) via Cloudflare, and draft outbound into the client's existing mailboxes via the mail gatekeeper — both sides need a one-time check.</p>
    <ol>
      <li>Zone → <strong>Email → Email Routing → enable</strong> (adds routing MX/TXT records; if mail is on Google/M365, routing coexists — verify the record changes with IT before applying).</li>
      <li>Create the discovery alias (e.g. <code>routine@${esc(c.domain||"client-domain.com")}</code>) and pipeline addresses; route to a monitored mailbox or a Worker; verify destination addresses when prompted.</li>
      <li>Check the <em>sending</em> domain's SPF, DKIM, DMARC health — agent-drafted volume rides it, and weak DMARC becomes spam-folder complaints blamed on "the AI."</li>
    </ol>`,
    verify:`A test mail to the alias arrives; SPF/DKIM/DMARC all pass on a checker; IT signed off on the record changes.` });

  if (c.useCases.some(u => u.cadence === "event") || c.systems.includes("ghl")) {
    steps.push({ id:"webhooks", title:"Webhook ingress — don't let Access eat your events",
      body:`<p>Access requires login on <em>every</em> path of the workspace hostname — which silently blocks the inbound webhooks (payment received, document signed) that trigger event Workflows.</p>
      <ol>
        <li>Give webhook receivers their own path or hostname (e.g. <code>hooks.${esc(c.domain||"client-domain.com")}</code> or a separate Worker route).</li>
        <li>In Zero Trust, add a <strong>bypass or service-auth policy</strong> for exactly that path — never for the workspace itself.</li>
        <li>Verify each provider's webhook <strong>signature</strong> before acting; design handlers idempotent (duplicate deliveries are normal).</li>
        <li>Add a <strong>rate limiting rule</strong> on the hook path — it's the one internet-reachable surface of the deployment.</li>
      </ol>`,
      verify:`A test event fires the Workflow; a forged request is rejected; the workspace hostname still demands login everywhere.` });
  }

  const regulated = c.vertical === "law" || c.vertical === "finserv" || c.vertical === "pt";
  steps.push({ id:"hardening", title:"Harden & instrument the platform",
    body:`<p>Four small settings that separate a demo from an operated deployment:</p>

  steps.push({ id:"mcpcheck", title:"Check for vendor MCP servers before building custom",
    body:`<p>Cloudflare OS connects to external systems two ways: its own Gatekeepers, and <strong>existing MCP servers</strong> governed through <strong>MCP Server Portals</strong> (Cloudflare One AI controls). MCP v2 made servers stateless HTTP workloads, and vendors are shipping official remote servers fast — so before each custom build below:</p>

    <div class="note"><b>Rule of thumb:</b> MCP for reads and vendor-maintained breadth; Gatekeepers for writes, walls, and client-owned audit policy. Price portal connections like stock-gatekeeper config, not like builds.</div>`,
    verify:`For each system below you can say which path it uses and why; portal-connected tools appear for a pilot user, disallowed tools are absent, and calls show in the portal's logs.` });

  const sysSteps = {
    google: { t:"Connect Google Workspace (stock gatekeeper)", b:`<ol>
      <li>In <code>console.cloud.google.com</code> (same project as sign-in if you made one): enable the Gmail, Calendar, and Drive APIs.</li>
      <li>Create an OAuth client (Web application) with redirect URI <code>https://${host}/gatekeeper/google/oauth</code>.</li>

      <li>A pilot user clicks Connect on the Google gatekeeper and grants the fuller scopes; policy starts <strong>read-only</strong>: no send scope until pilot week 2.</li></ol>`,
      v:`A pilot user's agent can summarize their inbox but a send attempt lands in the approval queue (or is refused), not in Sent.` },
    slack: { t:"Connect Slack (stock gatekeeper)", b:`<ol><li>api.slack.com/apps → Create app → from scratch, in the client's workspace.</li><li>Add the scopes the gatekeeper's doc page lists (start read-only: channels:history, channels:read).</li><li>Install to workspace; put the tokens in the gatekeeper credential config.</li><li>Route approval-queue notifications to a private #os-approvals channel.</li></ol>`, v:`Agent can summarize a channel; posting requires approval.` },
    notion: { t:"Connect Notion (stock gatekeeper)", b:`<ol><li>notion.so/my-integrations → New integration in the client's workspace, read-only capabilities first.</li><li>Share only the SOP/wiki pages that belong in agent context with the integration.</li><li>Token into the gatekeeper credential config.</li></ol>`, v:`Agent answers a question citing a wiki page it could only know from Notion.` },
    confluence: { t:"Connect Confluence (stock gatekeeper)", b:`<ol><li>Create an API token in the client's Atlassian admin.</li><li>Scope the gatekeeper to the specific spaces that belong in agent context.</li><li>Token into the gatekeeper credential config.</li></ol>`, v:`Agent cites a Confluence page correctly.` },
    zoominfo: { t:"Connect ZoomInfo (stock gatekeeper)", b:`<ol><li>Get API credentials from the client's ZoomInfo admin portal.</li><li>Configure per the gatekeeper's doc page; set a per-day lookup cap in policy.</li></ol>`, v:`Agent enriches a test company; the lookup appears in the observation log.` },
    m365: { t:"Build the Microsoft 365 gatekeeper (custom · Graph)", b:`<ol>
      <li>entra.microsoft.com → App registrations → New. Single tenant. Redirect URI: <code>https://${host}/gatekeeper/m365/oauth</code>.</li>
      <li>API permissions (delegated, admin consent): start with <code>Mail.Read</code>, <code>Calendars.Read</code>. Add write scopes only after pilot proves reads.</li>
      <li>Client secret → gatekeeper credential config.</li>
      <li>Scaffold the gatekeeper in <code>packages/custom-gatekeeper</code> — align the class shape with the gatekeeper interface in your pinned release (crib from a stock gatekeeper in the upstream <code>packages/</code>):</li></ol>`,
      code:`// packages/custom-gatekeeper/src/m365.ts — SCAFFOLD: align with your
// pinned release's gatekeeper interface before shipping.
export class M365Gatekeeper {
  // Credentials live here, injected as Worker secrets — never visible to agents.
  // Expose narrow, typed capabilities only:
  async summarizeInbox(userId: string, since: string) { /* Graph: GET /me/messages */ }
  async listEvents(userId: string, range: string)     { /* Graph: GET /me/calendarView */ }

  async draftReply(messageId: string, body: string)   { /* create draft only */ }

    qbo: { t:"Build the QuickBooks Online gatekeeper (custom)", b:`<ol>
      <li>developer.intuit.com → sign in with the client's Intuit developer account (create one owned by them) → Create an app → QuickBooks Online and Payments → scope <code>com.intuit.quickbooks.accounting</code>.</li>
      <li>Redirect URI: <code>https://${host}/gatekeeper/qbo/oauth</code>. Note client ID/secret.</li>
      <li>Connect the <strong>sandbox company first</strong>; production consent only after the pilot works in sandbox.</li>
      <li>Scaffold:</li></ol>`,
      code:`// packages/custom-gatekeeper/src/qbo.ts — SCAFFOLD
export class QboGatekeeper {
  async arAging(realmId: string)              { /* read: AgedReceivables report */ }
  async recentTransactions(realmId: string)   { /* read-only queries */ }
  async draftInvoice(realmId: string, data: InvoiceDraft) {
    /* create as DRAFT + enqueue for approval by: ${c.approvers.payments || "APPROVER"} */
  }
}`, v:`AR aging digest renders in a workspace doc from sandbox data; invoice creation waits in the approval queue.` },
    stripe: { t:"Build the Stripe gatekeeper (custom)", b:`<ol>
      <li>Client's Stripe dashboard → Developers → API keys → <strong>Create restricted key</strong>: read on Charges/Payouts/Disputes; write on Refunds ONLY.</li>
      <li>Never accept the full secret key — if the client offers it, decline and create the restricted key together.</li>
      <li>Scaffold:</li></ol>`,
      code:`// packages/custom-gatekeeper/src/stripe.ts — SCAFFOLD
export class StripeGatekeeper {
  async dailyRevenue()                 { /* read: charges + payouts */ }

    </ol>`,
    verify:`A champion runs a pilot workflow cold; the agent uses the right terms, process, and sources — confirmed in the observation log.` });

  steps.push({ id:"pilotready", title:"Pilot readiness — final gate",
    body:`<ul>
      <li>All pilot users signed in via ${c.idp==="access"?"Access/IdP":c.idp==="google"?"Google OAuth":"password (interim!)"}; roster loaded.</li>

      <li>Champions briefed; weekly tuning session on the calendar.</li>
    </ul>`,
    verify:`Sponsor signs the pilot charter; day-one pilot session scheduled.` });

  return steps;
}

function renderBuild(){
  const c = C();
  const steps = buildSteps();
  const done = steps.filter(s=>c.steps[s.id]).length;
  const pct = Math.round(100*done/steps.length);
  const header = `
  <h2>Phase 3 · Build Guide</h2>
  <p class="hint">Generated for <strong>${esc(c.name)}</strong> from the Discovery answers — hostnames, config, and per-system steps below are personalized. Follow top to bottom; each step says how to verify it worked. Change Discovery, and this guide regenerates.</p>
  <div class="note" style="max-width:52rem"><b>How this connects to your Cloudflare account:</b> this Studio never touches it — it only generates the config and commands. The connection happens in step 1: <code>wrangler login</code> signs your machine into the account via your browser, and <code>pnpm deploy</code> pushes the workspace there. When the guide completes, Cloudflare OS is a website at your hostname behind Access — that's where you and your users log in daily. The Studio stays your planning cockpit outside it.</div>
  <div class="bp-actions">
    <button class="primary" id="btnBlueprint" title="Opens your browser's print dialog — choose 'Save as PDF'">Blueprint PDF (print)</button>
    <button id="btnBlueprintHtml" title="The same document as a standalone HTML file">Download HTML</button>
  </div>
  <p class="hint">The blueprint is the client-ready document: executive summary, the full design, and this walkthrough — in the print dialog choose <strong>Save as PDF</strong>.</p>
  <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <p class="hint">${done} of ${steps.length} steps complete</p>
  ${(!c.domain || !c.accountId) ? `<div class="warnbox">Missing inputs: ${!c.domain?"<strong>company domain</strong> (Discovery → profile) ":""}${!c.accountId?"<strong>Account ID</strong> (step 2 below)":""} — placeholders appear in the config until filled.</div>` : ""}`;
  const body = steps.map((s,i)=>`
    <div class="step ${c.steps[s.id]?"done":""}">
      <div><div class="step-num">${i+1}</div></div>
      <div class="step-body">
        <h3>${esc(s.title)} <label><input type="checkbox" data-step="${s.id}" ${c.steps[s.id]?"checked":""}> done</label></h3>
        ${s.body||""}
        ${s.code!==undefined?`<div class="codeblock"><pre data-code="${i}"></pre><button class="copy" data-copy="${i}">Copy</button></div>`:""}
        ${s.body2||""}
        ${s.verify?`<div class="verify"><b>You know it worked when</b>${s.verify}</div>`:""}
      </div>
    </div>`).join("");
  return header + body + phaseNav("build");
}
function wireBuild(){
  const c = C();
  const steps = buildSteps();
  document.querySelectorAll("[data-code]").forEach(pre => { pre.textContent = steps[pre.dataset.code].code || ""; });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(steps[b.dataset.copy].code || ""));
  document.querySelectorAll("[data-step]").forEach(cb => cb.onchange = () => { c.steps[cb.dataset.step] = cb.checked; save(); render(); });
  document.getElementById("btnBlueprint").onclick = blueprintPrint;
  document.getElementById("btnBlueprintHtml").onclick = blueprintDownload;
  document.querySelectorAll("[data-bind]").forEach(el => el.addEventListener("change", () => { c[el.dataset.bind] = el.value.trim(); save(); render(); }));
}

    <div class="bp-stat"><b>$${fmtNum(m.totalVal)}</b><span>per month at $${m.rate}/hr</span></div>
    <div class="bp-stat"><b>${m.pilots.length}</b><span>pilot workflows</span></div>
    <div class="bp-stat"><b>${m.chosen.length}</b><span>integrations (${m.stock.length}s·${m.mcpRouted.length}p·${m.customBuild.length}b)</span></div>
    <div class="bp-stat"><b>~${m.weeks}w</b><span>to full handoff</span></div>
  </div>
  <p class="hint">Integrations key: s = stock gatekeeper · p = vendor MCP server via portal · b = custom gatekeeper build.</p>

  <h2 class="bp-break">Design objectives</h2>
  <h3>Pilot charter — the workflows that prove value</h3>
  <table><thead><tr><th>Workflow</th><th>Dept</th><th>Hrs/mo</th><th>Risk</th><th>Cadence</th></tr></thead><tbody>${pilotRows}</tbody></table>
  <p><strong>Standing guardrail:</strong> ${esc(VERTICALS[c.vertical].guard)}</p>
  ${wfRows ? `<h3>Automation — platform Workflows</h3><table><thead><tr><th>Workflow</th><th>Trigger</th><th>Dept</th></tr></thead><tbody>${wfRows}</tbody></table>` : ""}
  ${knRows ? `<h3>Knowledge & retrieval plan</h3><table><thead><tr><th>Source</th><th>Retrieval route</th><th>Owner</th></tr></thead><tbody>${knRows}</tbody></table>` : ""}
  <h3>Integration map</h3>
  <table><thead><tr><th>System</th><th>Path</th><th>Wave</th><th>Effort</th></tr></thead><tbody>${intRows}</tbody></table>
  <h3>Policy matrix — what needs a human, and which human</h3>
  <table><thead><tr><th>Workflow</th><th>Tier</th><th>Policy</th><th>Approver</th></tr></thead><tbody>${polRows}</tbody></table>
  <h3>Models & budgets</h3>
  <table><thead><tr><th>Task class</th><th>Route to</th><th>Control</th></tr></thead><tbody>
    <tr><td>Digests, triage, summaries</td><td>${c.provider==="workersai"?"Workers AI small models":"Fast/cheap tier"}</td><td>Default for Workflows</td></tr>
    <tr><td>Drafting, briefs, gadget building</td><td>${c.provider==="openai"?"OpenAI mid tier":"Mid tier"}</td><td>Default for Workspaces</td></tr>
    <tr><td>High-value judgment work</td><td>Frontier tier, explicitly selected</td><td>Per-team budget cap in AI Gateway</td></tr>
    <tr><td>All users</td><td>—</td><td>${c.dailyLimit} calls/user/day allowance; alerts at 80% of budget</td></tr>
  </tbody></table>

  <h2 class="bp-break">The setup walkthrough — ${steps.length} steps</h2>
  <div class="note"><b>How this connects to the Cloudflare account:</b> this document's generator never touches it. Step 1's <code>wrangler login</code> signs the deploy machine in via the browser; <code>pnpm deploy</code> pushes the workspace. When the walkthrough completes, Cloudflare OS is a website at https://${esc(host)} behind Access — that is where your team logs in daily.</div>
  ${stepsHtml}

  <h2 class="bp-break">Appendix — who does what</h2>
  <table><thead><tr><th>Side effect class</th><th>Approver</th></tr></thead><tbody>
    <tr><td>Payments / refunds</td><td>${esc(c.approvers.payments||"TBD")}</td></tr>
    <tr><td>Outbound sends</td><td>${esc(c.approvers.sends||"TBD")}</td></tr>
    <tr><td>Records / filings</td><td>${esc(c.approvers.records||"TBD")}</td></tr>
  </tbody></table>
  <p><strong>Only a human can do:</strong> Cloudflare/wrangler sign-in, account creation, OAuth consents and IdP configuration, BAA/DPA paperwork, approving queued side effects, and signatures. Agents draft and prepare; named people approve.</p>
  <div class="bp-foot">Generated ${esc(date)} by Cloudflare OS Studio from the "${esc(c.name)}" engagement record · Platform click-paths verified against Cloudflare OS v2 (Aug 2026) — re-verify against the pinned release you deploy · https://${esc(host)}</div>`;

  const el = document.getElementById("blueprint");
  el.innerHTML = html;
  el.querySelectorAll("[data-bpcode]").forEach(pre => { pre.textContent = codes[Number(pre.dataset.bpcode)]; });
  // A document carries no form controls: swap any inherited inputs/selects/buttons
  // from step bodies for styled value placeholders.
  el.querySelectorAll("input, select, textarea").forEach(inp => {
    const span = document.createElement("span");
    span.className = "bp-field";
    span.textContent = (inp.value || "").trim() || `⟨ ${inp.placeholder || "to be filled during setup"} ⟩`;
    inp.replaceWith(span);
  });
  el.querySelectorAll("button").forEach(b => b.remove());
  return el;
}

function blueprintPrint(){
  blueprintBuild();
  setTimeout(() => {
    try { window.print(); }
    catch(e){ toast("Printing is blocked in this frame — use Download HTML, or open the self-hosted copy"); }
  }, 60);
}

async function blueprintDownload(){
  const el = blueprintBuild();
  const c = C();
  const doc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(c.name)} — Cloudflare OS Blueprint</title><style>${BP_CSS}#blueprint{display:block}</style></head><body><div id="blueprint">${el.innerHTML}</div></body></html>`;
  const filename = `${slug(c.name)}-blueprint.html`;
  if (window.claude && window.claude.downloads && window.claude.downloads.save) {
    try { await window.claude.downloads.save({ filename, data: doc }); toast("Blueprint downloaded"); return; }
    catch(err){
      if (err && err.code === "declined") { toast("Download cancelled"); return; }
      if (err && (err.code === "extension_not_enabled" || err.code === "rejected_extension")) { toast("HTML downloads unavailable here — use Blueprint PDF (print) instead"); return; }
    }
  }
  const blob = new Blob([doc], { type:"text/html" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = filename; a.click(); URL.revokeObjectURL(a.href); toast("Blueprint downloaded");
}

/* =============================== render =============================== */
const PHASES = [
  { id: "discovery", label: "Discovery" },
  { id: "design", label: "Design & Scope" },
  { id: "build", label: "Build Guide" }
];
function phaseNav(cur){
  const i = PHASES.findIndex(p => p.id === cur);
  const prev = PHASES[i - 1], next = PHASES[i + 1];
  return `<div class="phase-nav">
    ${prev ? `<button data-goto="${prev.id}">← ${prev.label}</button>` : `<span></span>`}
    ${next ? `<button class="primary" data-goto="${next.id}">Continue to ${next.label} →</button>` : `<span></span>`}
  </div>`;
}
function renderBadges(){
  const c = C();
  const uc = c.useCases.length;
  document.getElementById("tb-discovery").textContent = uc ? String(uc) : "";
  const pilots = c.useCases.some(u => u.pilot)
    ? c.useCases.filter(u => u.pilot).length
    : Math.min(5, c.useCases.filter(u => u.risk !== "C").length);
  document.getElementById("tb-design").textContent = pilots ? String(pilots) : "";
  const steps = buildSteps(c);
  const done = steps.filter(s => c.steps[s.id]).length;
  document.getElementById("tb-build").textContent = done ? `${done}/${steps.length}` : "";
}
function render(){
  renderHeader();
  renderBadges();
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === db.tab));
  const v = document.getElementById("view");
  if (db.tab === "design")      { v.innerHTML = renderDesign();    wireDesign(); }
  else if (db.tab === "build")  { v.innerHTML = renderBuild();     wireBuild(); }
  else                          { v.innerHTML = renderDiscovery(); wireDiscovery(); }
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => {
    db.tab = b.dataset.goto; save(); render(); window.scrollTo(0, 0);
  });
}
render();
</script>
